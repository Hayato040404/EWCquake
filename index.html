<html lang="ja">

<head>

  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>EWC quake</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/ewc.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/ewc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ──────────────────────────────────────────────────────
       EWC quake — Design System
       Inspired by the discipline of Apple Human Interface Guidelines.
       Every pixel earns its place.
     ────────────────────────────────────────────────────── */

    :root {
      /* Surface */
      --bg: #F5F5F7;
      --card: #FFFFFF;
      --card-hover: #F9F9FB;
      --modal: #FFFFFF;
      --nav: rgba(245, 245, 247, 0.72);

      /* Text — deliberate weight hierarchy */
      --t1: #1D1D1F;
      /* headlines */
      --t2: #424245;
      /* body */
      --t3: #86868B;
      /* secondary */
      --t4: #AEAEB2;
      /* tertiary */

      /* Accents */
      --blue: #007AFF;
      --red: #FF3B30;
      --green: #34C759;
      --orange: #FF9500;
      --purple: #AF52DE;
      --indigo: #5856D6;
      --teal: #5AC8FA;

      /* Semantic */
      --separator: rgba(0, 0, 0, 0.06);
      --focus: rgba(0, 122, 255, 0.35);
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bot: env(safe-area-inset-bottom, 20px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --card-hover: #2C2C2E;
        --modal: #1C1C1E;
        --nav: rgba(0, 0, 0, 0.72);

        --t1: #F5F5F7;
        --t2: #EBEBF5;
        --t3: #8E8E93;
        --t4: #48484A;

        --blue: #0A84FF;
        --red: #FF453A;
        --green: #30D158;
        --orange: #FF9F0A;
        --purple: #BF5AF2;
        --indigo: #5E5CE6;
        --teal: #64D2FF;

        --separator: rgba(255, 255, 255, 0.08);
        --focus: rgba(10, 132, 255, 0.4);
      }
    }

    /* ── Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--t1);
      line-height: 1.47;
      letter-spacing: -0.01em;
      padding-bottom: calc(48px + var(--safe-bot));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Layout ── */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 0 24px;
    }

    /* ── Navigation ── */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--separator);
      padding-top: var(--safe-top);
    }

    @media (prefers-color-scheme: dark) {
      .nav-bar {
        border-bottom-color: rgba(255, 255, 255, 0.06);
      }
    }

    .nav-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav-large-title {
      padding: 14px 0 10px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--t1);
      line-height: 1.1;
    }

    .nav-bar.scrolled .nav-large-title {
      font-size: 17px;
      font-weight: 600;
      padding: 10px 0 8px;
      letter-spacing: -0.01em;
    }

    .control-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .control-bar::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      background: var(--card);
      color: var(--t2);
      border: 0.5px solid var(--separator);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      letter-spacing: 0.01em;
    }

    .pill-btn:active {
      opacity: 0.5;
    }

    .pill-spacer {
      flex: 1;
    }

    /* ── Admin Message ── */
    .admin-message {
      margin: 12px 20px 0;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      position: relative;
      display: none;
    }

    .admin-message.show {
      display: block;
    }

    .admin-message.info {
      background: rgba(0, 122, 255, 0.08);
      color: var(--blue);
    }

    .admin-message.warning {
      background: rgba(255, 149, 0, 0.08);
      color: var(--orange);
    }

    .admin-message.error {
      background: rgba(255, 59, 48, 0.08);
      color: var(--red);
    }

    .admin-message-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      font-size: 20px;
      color: inherit;
      opacity: 0.5;
      cursor: pointer;
      line-height: 1;
    }

    /* ── Sections ── */
    .section-title {
      padding: 28px 20px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .list-group {
      margin: 0 20px;
      overflow: hidden;
      border-radius: 16px;
      background: var(--card);
    }

    /* ── List Items ── */
    .list-item {
      display: flex;
      align-items: center;
      padding: 16px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .list-item:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 0.5px;
      background: var(--separator);
    }

    .list-item:active {
      background: var(--card-hover);
    }

    @media (hover: hover) {
      .list-item:hover {
        background: var(--card-hover);
      }
    }

    .list-content {
      flex: 1;
      min-width: 0;
      margin-right: 8px;
    }

    .item-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .item-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--t1);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .item-time {
      font-size: 15px;
      color: var(--t3);
      font-weight: 400;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .item-subtitle {
      font-size: 15px;
      color: var(--t2);
      font-weight: 500;
      margin-bottom: 3px;
    }

    .item-detail-text {
      font-size: 13px;
      color: var(--t3);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* ── Meta Pills ── */
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .meta-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg);
      color: var(--t3);
      letter-spacing: 0.01em;
    }

    .meta-pill.primary {
      background: rgba(0, 122, 255, 0.1);
      color: var(--blue);
    }

    .meta-pill.warning {
      background: rgba(255, 59, 48, 0.1);
      color: var(--red);
    }

    .meta-pill.info {
      background: var(--bg);
      color: var(--t3);
    }

    .tsunami-badge-wrapper .badge {
      height: 18px;
      font-size: 10px;
      padding: 1px 6px;
      font-weight: 700;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      height: 20px;
      letter-spacing: 0.02em;
    }

    .badge.warning {
      background: var(--red);
    }

    .badge.info {
      background: var(--t3);
    }

    .badge.forecast {
      background: var(--blue);
    }

    .badge.watch {
      background: var(--orange);
    }

    .badge.major {
      background: var(--purple);
    }

    .badge.observation {
      background: var(--indigo);
    }

    .badge.offshore {
      background: var(--teal);
    }

    .badge.arrival {
      background: var(--purple);
    }

    /* ── Item Actions ── */
    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: transparent;
      color: var(--t4);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      font-size: 16px;
    }

    .btn-icon:active {
      background: var(--separator);
    }

    .btn-icon.copied {
      color: var(--green);
    }

    .chevron {
      color: var(--t4);
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
    }

    /* ── Shindo Scale Badge (JMA Standard) ── */
    .shindo-circle {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: -0.03em;
    }

    .scale-1 {
      background: #9E9E9E;
      color: #fff;
    }

    .scale-2 {
      background: #5B9BD5;
      color: #fff;
    }

    .scale-3 {
      background: #2E75B6;
      color: #fff;
    }

    .scale-4 {
      background: #FFC000;
      color: #614A00;
    }

    .scale-5弱 {
      background: #ED7D31;
      color: #fff;
    }

    .scale-5強 {
      background: #E25B45;
      color: #fff;
    }

    .scale-5弱以上 {
      background: #E25B45;
      color: #fff;
    }

    .scale-6弱 {
      background: #C0504D;
      color: #fff;
    }

    .scale-6強 {
      background: #9B0023;
      color: #fff;
    }

    .scale-7 {
      background: #7030A0;
      color: #fff;
    }

    .scale-unknown {
      background: var(--t4);
      color: #fff;
    }

    /* ── Detail View (Sheet) ── */
    .detail-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .detail-container {
      background: var(--modal);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      will-change: transform;
    }

    @media (min-width: 701px) {
      .detail-view {
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
      }

      .detail-container {
        width: 640px;
        height: 88vh;
        border-radius: 16px;
        overflow: hidden;
      }
    }

    @media (max-width: 700px) {
      .detail-container {
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        height: calc(100% - 48px);
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(100%);
      }
    }

    .detail-nav {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 0.5px solid var(--separator);
      flex-shrink: 0;
    }

    .detail-title {
      font-weight: 600;
      font-size: 17px;
      color: var(--t1);
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 17px;
      cursor: pointer;
      padding: 8px;
    }

    .btn-text.bold {
      font-weight: 600;
    }

    .detail-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      -webkit-overflow-scrolling: touch;
    }

    .detail-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      border: 0.5px solid var(--separator);
    }

    .textarea-ios {
      width: 100%;
      background: var(--card);
      border: 0.5px solid var(--separator);
      border-radius: 12px;
      padding: 16px;
      font-family: inherit;
      font-size: 16px;
      color: var(--t1);
      min-height: 140px;
      margin-bottom: 20px;
      resize: none;
      line-height: 1.5;
    }

    .textarea-ios:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .btn-block {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.01em;
    }

    .btn-block:active {
      opacity: 0.75;
    }

    /* ── Empty / Loading States ── */
    .state-container {
      padding: 40px 20px;
      text-align: center;
      color: var(--t3);
    }

    .state-container .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
      opacity: 0.4;
    }

    .state-container .empty-text {
      font-size: 15px;
      font-weight: 500;
    }

    .state-container .empty-sub {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.6;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--separator);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--t1);
      color: var(--bg);
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      z-index: 3000;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── FAB ── */
    .fab-admin {
      position: fixed;
      bottom: max(20px, var(--safe-bot));
      right: 20px;
      width: 36px;
      height: 36px;
      background: var(--card);
      border: 0.5px solid var(--separator);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 16px;
      z-index: 100;
      color: var(--t4);
      transition: opacity 0.15s;
    }

    .fab-admin:active {
      opacity: 0.5;
    }

    /* ── Weather ── */
    #weatherIframe {
      width: 100%;
      min-height: 600px;
      border: none;
      display: block;
      border-radius: 12px;
    }

    /* ── Icons ── */
    .icon-svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .icon-copy {
      width: 18px;
      height: 18px;
    }

    /* ── Refresh Indicator ── */
    .refresh-indicator {
      position: fixed;
      top: calc(var(--safe-top) + 70px);
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--blue);
      color: #fff;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1500;
      opacity: 0;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-indicator.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .refresh-indicator .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      margin: 0;
    }

    /* ── Pull Refresh ── */
    .pull-refresh {
      position: fixed;
      top: calc(var(--safe-top) + 90px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border-radius: 14px;
      padding: 14px 22px;
      border: 0.5px solid var(--separator);
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--t2);
    }

    .pull-refresh.active {
      display: flex;
      animation: pullFade 0.2s ease;
    }

    @keyframes pullFade {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .pull-refresh .spinner {
      width: 18px;
      height: 18px;
      border-width: 2px;
      margin: 0;
    }

    /* ── Search (scroll-triggered) ── */
    .header-search {
      display: none;
      margin: 6px 0 10px;
    }

    .nav-bar.scrolled .header-search {
      display: block;
    }

    .search-input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background: var(--bg);
      font-size: 15px;
      color: var(--t1);
    }

    .search-input::placeholder {
      color: var(--t4);
    }

    /* ── Modal Backdrop ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.32);
      z-index: 1999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.show {
      display: block;
      opacity: 1;
    }

    /* ── Tsunami Detail Styles ── */
    .tsunami-header-card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      border: 0.5px solid var(--separator);
    }

    .tsunami-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tsunami-eq-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 14px;
      color: var(--t3);
      border-top: 0.5px solid var(--separator);
      padding-top: 14px;
    }

    .tsunami-meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tsunami-meta-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--t4);
    }

    .tsunami-meta-value {
      font-weight: 600;
      font-size: 15px;
      color: var(--t1);
    }

    .tsunami-headline-card {
      background: rgba(0, 122, 255, 0.06);
      border-left: 3px solid var(--blue);
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--t2);
    }

    .tsunami-area-group {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 0.5px solid var(--separator);
    }

    .tsunami-area-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--t1);
      margin-bottom: 12px;
      border-bottom: 0.5px solid var(--separator);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: -0.01em;
    }

    .tsunami-station-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;

  <script>
    const publicVapidKey = 'BC1T1-o4f9vLJ11ngQXOZTdKY8xd38vUyWeWyPosJ7JDJxnCPrAGtJZE_CUW4dqdh60eEUf5G-qzWjaojsSMer0';
    let earthquakeData = [];
    let eewData = null;
    let tsunamiData = [];

    const ICON_COPY = `<svg class="icon-svg icon-copy" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
    const ICON_CHECK = `<svg class="icon-svg icon-copy" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;

    async function fetchAdminMessage() {
      try {
        const response = await fetch('/api/admin-message');
        const data = await response.json();
        if (data.isVisible && data.text) {
          showAdminMessage(data.text, data.type || 'info');
        }
      } catch (error) {
        console.error('管理者メッセージの取得に失敗しました:', error);
      }
    }

    function showAdminMessage(text, type = 'info') {
      const messageElement = document.getElementById('adminMessage');
      const textElement = document.getElementById('adminMessageText');
      textElement.textContent = text;
      messageElement.className = `admin-message ${type} show`;
    }

    function hideAdminMessage() {
      const messageElement = document.getElementById('adminMessage');
      messageElement.classList.remove('show');
    }

    async function subscribe() {
      if (!('serviceWorker' in navigator)) {
        showAlert('このブラウザはプッシュ通知をサポートしていません。');
        return;
      }

      if (!('Notification' in window)) {
        showAlert('このブラウザは通知をサポートしていません。');
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          showAlert('通知の許可が必要です。');
          return;
        }

        const registration = await navigator.serviceWorker.register('/service-worker.js');
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
        });

        await fetch('/subscribe', {
          method: 'POST',
          body: JSON.stringify(subscription),
          headers: {
            'Content-Type': 'application/json'
          }
        });

        showAlert('通知が許可されました！');
      } catch (error) {
        console.error('通知の許可に失敗しました:', error);
        showAlert('通知の許可に失敗しました。');
      }
    }

    async function sendTestNotification() {
      if (!('serviceWorker' in navigator)) {
        showAlert('このブラウザはプッシュ通知をサポートしていません。');
        return;
      }

      try {
        const registration = await navigator.serviceWorker.getRegistration();
        if (!registration) {
          showAlert('サービスワーカーが登録されていません。');
          return;
        }

        const options = {
          body: 'これはテスト通知です。',
          icon: '/icon.png'
        };
        await registration.showNotification('テスト通知', options);
      } catch (error) {
        console.error('テスト通知の送信に失敗しました:', error);
        showAlert('テスト通知の送信に失敗しました。');
      }
    }

    function showAlert(message) {
      alert(message);
    }

    function showCopyToast() {
      const toast = document.getElementById('copyToast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-999999px';
          textArea.style.top = '-999999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
        }
        showCopyToast();
        return true;
      } catch (err) {
        console.error('コピーに失敗しました:', err);
        showAlert('コピーに失敗しました');
        return false;
      }
    }

    function getEarthquakeTimeValue(earthquake) {
      const raw = earthquake?.time || earthquake?.earthquake?.time || '';
      const value = new Date(raw).getTime();
      return Number.isFinite(value) ? value : 0;
    }

    function getScaleDescription(scale) {
      const scaleDescriptions = {
        10: '1',
        20: '2',
        30: '3',
        40: '4',
        45: '5弱',
        46: '5弱以上',
        50: '5強',
        55: '6弱',
        60: '6強',
        70: '7'
      };
      return scaleDescriptions[scale] || '不明';
    }

    function getScaleCircleClass(scaleText) {
      if (!scaleText || scaleText === '不明') return 'scale-unknown';
      return `scale-${scaleText}`;
    }

    function resolveDestinationScale(earthquake, index = -1) {
      const currentScale = earthquake?.earthquake?.maxScale;

      if (typeof currentScale === 'number' && currentScale !== -1) {
        return currentScale;
      }

      if (!earthquake || earthquake?.issue?.type !== 'Destination') {
        return currentScale;
      }

      const targetTime = earthquake?.earthquake?.time || '';
      const targetHypocenter = earthquake?.earthquake?.hypocenter?.name || '';

      const startIndex = Number.isInteger(index) && index >= 0 ? index + 1 : 0;

      for (let i = startIndex; i < earthquakeData.length; i++) {
        const prev = earthquakeData[i];
        if (!prev || prev?.issue?.type !== 'ScalePrompt') continue;
        if ((prev?.earthquake?.time || '') !== targetTime) continue;

        const prevHypocenter = prev?.earthquake?.hypocenter?.name || '';
        if (targetHypocenter && prevHypocenter && prevHypocenter !== targetHypocenter) continue;

        const prevScale = prev?.earthquake?.maxScale;
        if (typeof prevScale === 'number' && prevScale !== -1) {
          return prevScale;
        }
      }

      for (let i = startIndex; i < earthquakeData.length; i++) {
        const prev = earthquakeData[i];
        if (!prev || prev?.issue?.type !== 'ScalePrompt') continue;
        if ((prev?.earthquake?.time || '') !== targetTime) continue;

        const prevScale = prev?.earthquake?.maxScale;
        if (typeof prevScale === 'number' && prevScale !== -1) {
          return prevScale;
        }
      }

      return currentScale;
    }

    function getDisplayedScaleText(earthquake, index = -1) {
      const scale = resolveDestinationScale(earthquake, index);
      return getScaleDescription(scale);
    }

    function generateDetailedEarthquakeText(earthquake, index = -1) {
      const time = new Date(earthquake.earthquake.time);
      const date = time.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
      const timeStr = time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const hypocenter = earthquake.earthquake.hypocenter.name;
      const displayScale = resolveDestinationScale(earthquake, index);
      const maxScale = getScaleDescription(displayScale);

      let magnitude = earthquake.earthquake.hypocenter.magnitude;
      let depth = earthquake.earthquake.hypocenter.depth;

      depth = depth === -1 ? '不明' : depth === 0 ? 'ごく浅い' : `約${depth}km`;
      magnitude = magnitude === -1 ? '不明' : magnitude.toFixed(1);

      const pointsByScale = groupPointsByScale(earthquake.points);
      const tsunamiInfo = getTsunamiInfo(earthquake.earthquake.domesticTsunami);
      const freeFormComment = earthquake.comments?.freeFormComment || '';

      let formattedMessage;

      if (earthquake.issue && earthquake.issue.type === 'ScalePrompt') {
        formattedMessage = `【EWC震度速報(${timeStr})】`;
        const scaleOrder = ['7', '6強', '6弱', '5強', '5弱', '5弱以上と推定されるが震度情報を入手していない', '4', '3', '2', '1'];
        const sortedScales = Object.keys(pointsByScale).sort((a, b) => {
          return scaleOrder.indexOf(a) - scaleOrder.indexOf(b);
        });

        sortedScales.forEach(scale => {
          formattedMessage += `\n《震度${scale}》`;
          Object.keys(pointsByScale[scale]).forEach(pref => {
            const uniqueAreas = new Set(pointsByScale[scale][pref]);
            formattedMessage += `\n【${pref}】${Array.from(uniqueAreas).join('  ')}`;
          });
        });
      } else {
        formattedMessage = `【EWC地震情報  最大震度${maxScale}】\n震源地：${hypocenter}\n規模：M${magnitude}\n深さ：${depth}\n日時：${date} ${timeStr}頃\n${tsunamiInfo}`;

        if (earthquake.issue && (earthquake.issue.type === 'ScaleAndDestination' || earthquake.issue.type === 'DetailScale')) {
          formattedMessage += `\n\n[各地の震度]`;
        } else if (Object.keys(pointsByScale).length > 0) {
          formattedMessage += `\n\n[各地の震度]`;
        }

        const scaleOrder = ['7', '6強', '6弱', '5強', '5弱', '5弱以上と推定されるが震度情報を入手していない', '4', '3', '2', '1'];
        const sortedScales = Object.keys(pointsByScale).sort((a, b) => {
          return scaleOrder.indexOf(a) - scaleOrder.indexOf(b);
        });

        sortedScales.forEach(scale => {
          formattedMessage += `\n《震度${scale}》`;
          Object.keys(pointsByScale[scale]).forEach(pref => {
            const uniqueCities = new Set();
            pointsByScale[scale][pref].forEach(addr => {
              uniqueCities.add(addr);
            });
            formattedMessage += `\n【${pref}】${Array.from(uniqueCities).join('  ')}`;
          });
        });

        if (freeFormComment) {
          formattedMessage += `\n\n【情報】\n${freeFormComment}`;
        }
        if (earthquake.issue && earthquake.issue.correct === 'ScaleOnly') {
          formattedMessage += `\n\n《震度の訂正がありました。》`;
        }
        if (earthquake.issue && earthquake.issue.correct === 'DestinationOnly') {
          formattedMessage += `\n\n《震源の訂正がありました。》`;
        }
        if (earthquake.issue && earthquake.issue.correct === 'ScaleAndDestination') {
          formattedMessage += `\n\n《震源・震度の訂正がありました。》`;
        }
      }

      return formattedMessage;
    }

    function generateDetailedEewText(data) {
      if (data.isCancel) {
        return "先程の緊急地震速報は取り消されました。";
      }
      let formattedMessage = formatEewMessage(data);
      if (data.isAssumption) {
        formattedMessage += "\n※この緊急地震速報は精度が低い可能性があります※";
      }
      return formattedMessage;
    }

    function generateDetailedTsunamiText(tsunami, detailedData) {
      const time = new Date(tsunami.at);
      const date = time.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
      const timeStr = time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      let titleText = tsunami.ttl || '津波情報';
      let formattedMessage = `【EWC ${titleText}】\n発生日時：${date} ${timeStr}頃\n震源地：${tsunami.anm || '不明'}\n規模：${tsunami.mag ? 'M' + tsunami.mag : '不明'}`;

      if (!detailedData || !detailedData.Body || !detailedData.Body.Tsunami) {
        const kind = tsunami.kind && tsunami.kind.length > 0 ? tsunami.kind[0].kind : '不明';
        formattedMessage += `\n\n【状況】\n${kind}\n※詳細情報は電文から直接取得できませんでした。`;
        return formattedMessage;
      }

      const bodyTsunami = detailedData.Body.Tsunami;

      // 1. Tsunami Warning / Forecast section (津波警報・注意報・予報)
      if (bodyTsunami.Forecast && bodyTsunami.Forecast.Item) {
        const items = Array.isArray(bodyTsunami.Forecast.Item)
          ? bodyTsunami.Forecast.Item
          : [bodyTsunami.Forecast.Item].filter(item => item);

        const forecasts = [];
        const watches = [];
        const warnings = [];
        const majorWarnings = [];

        items.forEach(item => {
          const areaName = item.Area?.Name || '不明';
          const maxHeight = item.MaxHeight?.TsunamiHeight ? `${item.MaxHeight.TsunamiHeight}m` : '不明';
          const category = typeof item.Category?.Kind === 'string'
            ? item.Category.Kind
            : (item.Category?.Kind?.Name || '不明');

          const entry = `${areaName}　〈${maxHeight}〉`;

          if (category.includes('大津波')) {
            majorWarnings.push(entry);
          } else if (category.includes('警報')) {
            warnings.push(entry);
          } else if (category.includes('注意報')) {
            watches.push(entry);
          } else {
            forecasts.push(entry);
          }
        });

        if (majorWarnings.length > 0) {
          formattedMessage += `\n\n【大津波警報 🟪】\n現在、大津波警報を発表しています！今すぐ高台や避難ビルへ避難！\n［対象地域］\n${majorWarnings.join('\n')}`;
        }
        if (warnings.length > 0) {
          formattedMessage += `\n\n【津波警報 🟥】\n現在、津波警報を発表しています！高台や近くの避難ビルへ避難！\n［対象地域］\n${warnings.join('\n')}`;
        }
        if (watches.length > 0) {
          formattedMessage += `\n\n【津波注意報 🟨】\n現在、津波注意報を発表しています！海や川から直ちに離れてください。\n［対象地域］\n${watches.join('\n')}`;
        }
        if (forecasts.length > 0) {
          formattedMessage += `\n\n【津波予報（若干の海面変動） 🟦】\n若干の海面変動が予想されますが、被害の心配はありません。\n［対象地域］\n${forecasts.join('\n')}`;
        }
      }

      // 2. Tsunami Observation section (実際の観測値)
      if (bodyTsunami.Observation && bodyTsunami.Observation.Item) {
        const obsItems = Array.isArray(bodyTsunami.Observation.Item)
          ? bodyTsunami.Observation.Item
          : [bodyTsunami.Observation.Item].filter(item => item);

        formattedMessage += `\n\n■ 実測された津波の観測値`;

        obsItems.forEach(item => {
          const areaName = item.Area?.Name;
          const stations = Array.isArray(item.Station)
            ? item.Station
            : [item.Station].filter(s => s);

          if (areaName) {
            formattedMessage += `\n\n【${areaName}】`;
          } else {
            formattedMessage += `\n\n【沖合・その他観測点】`;
          }

          stations.forEach(station => {
            const name = station.Name || '不明';
            const sensor = station.Sensor ? `（${station.Sensor}）` : '';

            // Format first wave
            let firstWaveStr = '第一波：';
            if (station.FirstHeight) {
              if (station.FirstHeight.ArrivalTime) {
                const arrival = new Date(station.FirstHeight.ArrivalTime);
                const arrTimeStr = arrival.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                const initial = station.FirstHeight.Initial ? ` (${station.FirstHeight.Initial})` : '';
                firstWaveStr += `${arrTimeStr}${initial}`;
              } else if (station.FirstHeight.Condition) {
                firstWaveStr += station.FirstHeight.Condition;
              } else {
                firstWaveStr += '不明';
              }
            } else {
              firstWaveStr += '観測なし';
            }

            // Format max height
            let maxHeightStr = '最大波：';
            if (station.MaxHeight) {
              if (station.MaxHeight.TsunamiHeight) {
                maxHeightStr += `${station.MaxHeight.TsunamiHeight}m`;
                if (station.MaxHeight.DateTime) {
                  const maxTime = new Date(station.MaxHeight.DateTime);
                  const maxTimeStr = maxTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                  maxHeightStr += ` (${maxTimeStr})`;
                }
              } else if (station.MaxHeight.Condition) {
                maxHeightStr += station.MaxHeight.Condition;
              } else {
                maxHeightStr += '不明';
              }
            } else {
              maxHeightStr += '観測なし';
            }

            formattedMessage += `\n・${name}${sensor}\n　└ ${maxHeightStr} / ${firstWaveStr}`;
          });
        });
      }

    function getWaveHeightClass(heightStr, condition) {
      if (condition === '観測中' || condition === '上昇中') {
        return 'height-observing';
      }
      if (condition === '微小' || condition === '微弱') {
        return 'height-minor';
      }
      if (!heightStr) {
        return 'height-none';
      }

      const height = parseFloat(heightStr.replace(/[<m]/g, ''));
      if (isNaN(height)) {
        return 'height-none';
      }

      if (height >= 3.0) return 'height-major';
      if (height >= 1.0) return 'height-warning';
      if (height >= 0.2) return 'height-watch';
      return 'height-minor';
    }

    function parseDepth(coordStr) {
      if (!coordStr) return '不明';
      const parts = coordStr.split('-');
      if (parts.length >= 2) {
        const meters = parseInt(parts[parts.length - 1]);
        if (!isNaN(meters)) {
          if (meters === 0) return 'ごく浅い';
          return `約${meters / 1000}km`;
        }
      }
      return '不明';
    }

    function getTsunamiSummaryText(summary, details) {
      if (!details || !details.Body || !details.Body.Tsunami) {
        return `${summary.ttl}が発表されました。`;
      }

      const bodyTsunami = details.Body.Tsunami;

      // Coastal Observations
      if (summary.ttl === '津波観測に関する情報' && bodyTsunami.Observation) {
        let maxObs = null;
        let maxObsStation = '';
        let count = 0;

        const obsItems = Array.isArray(bodyTsunami.Observation.Item)
          ? bodyTsunami.Observation.Item
          : [bodyTsunami.Observation.Item].filter(item => item);

        obsItems.forEach(item => {
          const stations = Array.isArray(item.Station) ? item.Station : [item.Station].filter(s => s);
          stations.forEach(s => {
            count++;
            const hStr = s.MaxHeight?.TsunamiHeight;
            if (hStr) {
              const h = parseFloat(hStr);
              if (!isNaN(h) && (maxObs === null || h > maxObs)) {
                maxObs = h;
                maxObsStation = s.Name;
              }
            }
          });
        });

        if (maxObs !== null) {
          return `${maxObsStation}で最大${maxObs}mの津波を観測（計${count}地点で観測中）`;
        }
        return `各地で津波を観測しています（計${count}地点）`;
      }

      // Offshore Observations
      if (summary.ttl === '沖合の津波観測に関する情報' && bodyTsunami.Observation) {
        let activeStations = [];
        const obsItems = Array.isArray(bodyTsunami.Observation.Item)
          ? bodyTsunami.Observation.Item
          : [bodyTsunami.Observation.Item].filter(item => item);

        obsItems.forEach(item => {
          const stations = Array.isArray(item.Station) ? item.Station : [item.Station].filter(s => s);
          stations.forEach(s => {
            if (s.FirstHeight?.ArrivalTime || s.MaxHeight?.Condition === '観測中') {
              activeStations.push(s.Name.replace(/[５０ｋｍＡＢ]/g, ''));
            }
          });
        });

        if (activeStations.length > 0) {
          const sample = activeStations.slice(0, 3).join('、');
          const suffix = activeStations.length > 3 ? 'など' : '';
          return `${sample}${suffix}の沖合で津波を観測中（沿岸に到達の可能性）`;
        }
        return '沖合の観測点で津波を観測しています。';
      }

      // Warnings and Forecasts
      if (bodyTsunami.Forecast && bodyTsunami.Forecast.Item) {
        const items = Array.isArray(bodyTsunami.Forecast.Item)
          ? bodyTsunami.Forecast.Item
          : [bodyTsunami.Forecast.Item].filter(item => item);

        let maxCategory = '';
        let majorCount = 0;
        let warnCount = 0;
        let watchCount = 0;
        let forecastCount = 0;

        items.forEach(item => {
          const category = typeof item.Category?.Kind === 'string'
            ? item.Category.Kind
            : (item.Category?.Kind?.Name || '不明');
          if (category.includes('大津波')) majorCount++;
          else if (category.includes('警報')) warnCount++;
          else if (category.includes('注意報')) watchCount++;
          else forecastCount++;
        });

        if (majorCount > 0) return `${majorCount}地域に「大津波警報」を発表中！直ちに高台へ避難！`;
        if (warnCount > 0) return `${warnCount}地域に「津波警報」、${watchCount}地域に注意報を発表中。`;
        if (watchCount > 0) return `${watchCount}地域に「津波注意報」を発表中。海から離れてください。`;
        return `${forecastCount}地域に「若干の海面変動（予報）」が発表されています。`;
      }

      return `${summary.ttl}が発表されました。`;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 2000, delay = 0 } = options;
      
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      
      try {
        if (delay > 0) {
          console.log(`Simulating ${delay}ms delay for P2P API...`);
          await new Promise((resolve, reject) => {
            const timeoutId = setTimeout(resolve, delay);
            controller.signal.addEventListener('abort', () => {
              clearTimeout(timeoutId);
              reject(new DOMException('The user aborted a request.', 'AbortError'));
            });
          });
        }
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    function mapJmaScaleToP2P(scaleStr) {
      const mapping = {
        '1': 10,
        '2': 20,
        '3': 30,
        '4': 40,
        '5-': 45,
        '5弱': 45,
        '5+': 50,
        '5強': 50,
        '6-': 55,
        '6弱': 55,
        '6+': 60,
        '6強': 60,
        '7': 70
      };
      return mapping[scaleStr] || -1;
    }

    function parseDomesticTsunami(commentsObs) {
      if (!commentsObs) return 'None';
      if (commentsObs.includes('津波の心配はありません')) return 'None';
      if (commentsObs.includes('若干の海面変動') || commentsObs.includes('被害の心配はありません')) return 'NonEffective';
      if (commentsObs.includes('大津波警報') || commentsObs.includes('津波警報')) return 'Warning';
      if (commentsObs.includes('津波注意報')) return 'Watch';
      if (commentsObs.includes('調査中')) return 'Checking';
      return 'None';
    }

    function getDetailUrl(lists) {
      if (!Array.isArray(lists) || lists.length === 0) return null;
      const preferredCodes = ['VXSE53', 'VXSE51', 'VXSE52'];
      for (const code of preferredCodes) {
        const found = lists.find(l => l.code === code && l.url);
        if (found) return found.url;
      }
      const anyUrl = lists.find(l => l.url);
      return anyUrl ? anyUrl.url : null;
    }

    function mapJmaItemToP2P(item, report, detailJson) {
      let timeStr = '';
      if (detailJson?.Body?.Earthquake?.OriginTime) {
        timeStr = detailJson.Body.Earthquake.OriginTime;
      } else if (report.data?.originTimeNew || report.data?.originTime) {
        timeStr = report.data.originTimeNew || report.data.originTime;
      } else if (item.originTimeNew || item.originTime) {
        timeStr = item.originTimeNew || item.originTime;
      } else {
        timeStr = report.datetime;
      }

      if (timeStr && !timeStr.includes('T')) {
        timeStr = timeStr.replace(/-/g, '/');
      }

      const dataSrc = report.data || {};
      let hypocenterName = dataSrc.hypoName || item.hypoName || '不明';
      let depthVal = dataSrc.depth !== undefined ? parseInt(dataSrc.depth) : (item.depth !== undefined ? parseInt(item.depth) : -1);
      if (isNaN(depthVal)) depthVal = -1;
      let magnitudeVal = dataSrc.magnitude !== undefined ? parseFloat(dataSrc.magnitude) : (item.magnitude !== undefined ? parseFloat(item.magnitude) : -1);
      if (isNaN(magnitudeVal)) magnitudeVal = -1;

      if (detailJson?.Body?.Earthquake) {
        const eq = detailJson.Body.Earthquake;
        if (eq.Hypocenter) {
          if (eq.Hypocenter.Name) hypocenterName = eq.Hypocenter.Name;
          if (eq.Hypocenter.Depth !== undefined) {
            const d = parseInt(eq.Hypocenter.Depth);
            if (!isNaN(d)) depthVal = d;
          }
        }
        if (eq.Magnitude !== undefined) {
          const m = parseFloat(eq.Magnitude);
          if (!isNaN(m)) magnitudeVal = m;
        }
      }

      let maxScale = -1;
      if (detailJson?.Body?.Intensity?.Observation?.MaxInt) {
        maxScale = mapJmaScaleToP2P(detailJson.Body.Intensity.Observation.MaxInt);
      } else if (report.data?.int) {
        maxScale = mapJmaScaleToP2P(report.data.int);
      } else if (item.int) {
        maxScale = mapJmaScaleToP2P(item.int);
      }

      let points = [];
      if (detailJson?.Body?.Intensity?.Observation) {
        const prefs = detailJson.Body.Intensity.Observation.Pref;
        if (Array.isArray(prefs)) {
          prefs.forEach(pref => {
            const prefName = pref.Name;
            if (Array.isArray(pref.Area)) {
              pref.Area.forEach(area => {
                if (Array.isArray(area.City)) {
                  area.City.forEach(city => {
                    if (Array.isArray(city.IntensityStation)) {
                      city.IntensityStation.forEach(station => {
                        points.push({
                          pref: prefName,
                          addr: station.Name,
                          scale: mapJmaScaleToP2P(station.Int)
                        });
                      });
                    } else {
                      points.push({
                        pref: prefName,
                        addr: city.Name,
                        scale: mapJmaScaleToP2P(city.MaxInt)
                      });
                    }
                  });
                } else {
                  points.push({
                    pref: prefName,
                    addr: area.Name,
                    scale: mapJmaScaleToP2P(area.MaxInt)
                  });
                }
              });
            } else {
              points.push({
                pref: prefName,
                addr: prefName,
                scale: mapJmaScaleToP2P(pref.MaxInt)
              });
            }
          });
        }
      }

      let commentsText = '';
      let domesticTsunami = 'Unknown';
      if (detailJson?.Body?.Comments?.Observation) {
        commentsText = detailJson.Body.Comments.Observation;
        domesticTsunami = parseDomesticTsunami(commentsText);
      } else if (detailJson?.Body?.Comments?.FreeFormComment) {
        commentsText = detailJson.Body.Comments.FreeFormComment;
        domesticTsunami = parseDomesticTsunami(commentsText);
      } else {
        domesticTsunami = 'None';
      }

      if (commentsText.includes('この地震による津波の心配はありません。')) {
        commentsText = commentsText.replace('この地震による津波の心配はありません。', '').trim();
      }

      let issueType = 'DetailScale';
      const title = detailJson?.Head?.Title || detailJson?.Control?.Title || report.title || '';
      if (title.includes('震度速報') || title.includes('震度に関する情報') || report.code === 'VXSE51') {
        issueType = 'ScalePrompt';
      } else if (title.includes('震源に関する情報') || report.code === 'VXSE52') {
        issueType = 'Destination';
      } else if (title.includes('震源・震度情報') || title.includes('震源・震度に関する情報') || report.code === 'VXSE53') {
        issueType = 'ScaleAndDestination';
      }

      return {
        time: report.datetime ? report.datetime.replace(/-/g, '/') : timeStr,
        code: 551,
        issue: {
          type: issueType,
          correct: 'None'
        },
        earthquake: {
          time: timeStr,
          hypocenter: {
            name: hypocenterName,
            depth: depthVal,
            magnitude: magnitudeVal
          },
          maxScale: maxScale,
          domesticTsunami: domesticTsunami
        },
        points: points,
        comments: {
          freeFormComment: commentsText
        }
      };
    }

    async function fetchAlternativeEarthquakeInfo() {
      const response = await fetch('https://earthquake-api-v2.nakn.jp/api/v2/list?limit=10');
      if (!response.ok) throw new Error(`alternative earthquake list: ${response.status}`);
      const data = await response.json();
      if (!data || data.status !== 'ok' || !Array.isArray(data.items)) {
        throw new Error('Invalid alternative earthquake data format');
      }

      const allReports = [];
      data.items.forEach(item => {
        if (Array.isArray(item.lists)) {
          item.lists.forEach(report => {
            allReports.push({
              item: item,
              report: report
            });
          });
        }
      });

      allReports.sort((a, b) => {
        const parseDateStr = (r, it) => {
          const raw = r.datetime || r.date || it.originTimeNew || it.originTime || '';
          const clean = raw.includes('T') ? raw : raw.replace(/-/g, '/');
          const t = new Date(clean).getTime();
          return isNaN(t) ? 0 : t;
        };
        return parseDateStr(b.report, b.item) - parseDateStr(a.report, a.item);
      });

      const targetReports = allReports.slice(0, 10);

      const detailPromises = targetReports.map(async (target) => {
        const url = target.report.url;
        if (!url) return null;
        try {
          const detailRes = await fetch(url);
          if (!detailRes.ok) throw new Error(`status: ${detailRes.status}`);
          return await detailRes.json();
        } catch (err) {
          console.warn(`Failed to fetch detail for event ${target.item.eventId} from ${url}:`, err);
          return null;
        }
      });

      const details = await Promise.all(detailPromises);

      earthquakeData = targetReports.map((target, idx) => mapJmaItemToP2P(target.item, target.report, details[idx]));
      displayEarthquakeList(earthquakeData);
    }

    async function fetchTsunamiInfo() {
      try {
        const response = await fetch('https://www.jma.go.jp/bosai/tsunami/data/list.json');
        const tsunamiList = await response.json();
        tsunamiData = [];

        const batchSize = 3;
        for (let i = 0; i < Math.min(tsunamiList.length, 10); i += batchSize) {
          const batch = tsunamiList.slice(i, i + batchSize);
          const batchPromises = batch.map(async (tsunami) => {
            if (tsunamiCache.has(tsunami.json)) {
              return tsunamiCache.get(tsunami.json);
            }
            try {
              const detailResponse = await fetch(`https://www.jma.go.jp/bosai/tsunami/data/${tsunami.json}`);
              const detailData = await detailResponse.json();
              const result = { summary: tsunami, details: detailData };
              tsunamiCache.set(tsunami.json, result);
              return result;
            } catch (detailError) {
              console.error(`Error fetching tsunami details for ${tsunami.json}:`, detailError);
              return { summary: tsunami, details: null };
            }
          });
          const batchResults = await Promise.all(batchPromises);
          tsunamiData.push(...batchResults);
        }

        displayTsunamiList(tsunamiData);
      } catch (error) {
        console.error('Error fetching tsunami information:', error);
        document.getElementById('tsunamiList').innerHTML = `
          <div class="state-container">
            <div>🌊 津波情報の取得に失敗しました</div>
          </div>
        `;
      }
    }

    function formatEewMessage(data) {
      let magnitude = data.Magunitude;
      magnitude = typeof magnitude === "number" || (typeof magnitude === "string" && !isNaN(magnitude))
        ? parseFloat(magnitude).toFixed(1) : "不明";

      let depthStr = "不明";
      if (typeof data.Depth === "number" || (typeof data.Depth === "string" && !isNaN(data.Depth))) {
        const d = parseFloat(data.Depth);
        if (d === 0) {
          depthStr = "ごく浅い";
        } else {
          depthStr = `${d}km`;
        }
      }

      let formattedDate = "不明";
      if (data.OriginTime) {
        const match = data.OriginTime.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
        if (match) {
          formattedDate = `${match[1]}年${match[2]}月${match[3]}日 ${match[4]}時${match[5]}分${match[6]}秒頃`;
        } else {
          // fallback
          const dateParts = data.OriginTime.split(' ');
          if (dateParts.length >= 2) {
            const dp = dateParts[0].split('/');
            const tp = dateParts[1].split(':');
            if (dp.length >= 3 && tp.length >= 3) {
              formattedDate = `${dp[0]}年${dp[1]}月${dp[2]}日 ${tp[0]}時${tp[1]}分${tp[2]}秒頃`;
            } else {
              formattedDate = data.OriginTime + "頃";
            }
          } else {
            formattedDate = data.OriginTime + "頃";
          }
        }
      }

      const serialStr = data.Serial || "不明";
      const finalStr = data.isFinal ? "（最終報）" : "";
      const maxIntensity = data.MaxIntensity || "不明";

      let message = `【EWC緊急地震速報　推定震度${maxIntensity}】（第${serialStr}報${finalStr}）\n${formattedDate}、地震が発生した模様です。震源地は${data.Hypocenter || '不明'}で、震源の深さは${depthStr}、地震の規模を示すマグニチュードは${magnitude}と推定されます。`;

      if (data.WarnArea && Array.isArray(data.WarnArea) && data.WarnArea.length > 0) {
        message += `\n\n[予想される震度]`;
        const areasByShindo = {};
        data.WarnArea.forEach(area => {
          const shindo = area.Shindo1;
          if (shindo) {
            areasByShindo[shindo] = areasByShindo[shindo] || [];
            areasByShindo[shindo].push(area.Chiiki);
          }
        });
        const shindoOrder = ['7', '6強', '6弱', '5強', '5弱', '4', '3', '2', '1', '不明'];
        const sortedShindos = Object.keys(areasByShindo).sort((a, b) => shindoOrder.indexOf(a) - shindoOrder.indexOf(b));
        sortedShindos.forEach(shindo => {
          message += `\n《最大震度${shindo}》\n${areasByShindo[shindo].join(' ')}`;
        });
      }
      return message;
    }

    function groupPointsByScale(points) {
      const pointsByScale = {};
      if (!points || !Array.isArray(points)) return pointsByScale;
      points.forEach(point => {
        const scale = getScaleDescription(point.scale);
        let addr = point.addr;
        const prefecture = point.pref;
        if (!scale) return;

        let originalAddr = addr;
        const cityMatch = addr.match(/([^市区町村]+[市区町村])/);
        if (cityMatch) addr = cityMatch[1];

        const cityAdjustments = {
          "大町": "大町市", "貝町": "市貝町", "田村": "田村市",
          "川市": "市川市", "田市": "町田市", "原市": "市原市",
          "大村": "大村市", "山市": "村山市", "上市": "村上市", "山形県村": "山形県村山", "東村": "東村山市"
        };
        if (cityAdjustments[addr]) addr = cityAdjustments[addr];

        pointsByScale[scale] = pointsByScale[scale] || {};
        pointsByScale[scale][prefecture] = pointsByScale[scale][prefecture] || [];
        pointsByScale[scale][prefecture].push(addr);
      });
      return pointsByScale;
    }

    function shareEditedMessage(textareaId, title) {
      const editedMessage = document.getElementById(textareaId).value;
      if (navigator.share) {
        navigator.share({ title: title, text: editedMessage }).catch(console.error);
      } else {
        showAlert('このブラウザは共有機能をサポートしていません。');
      }
    }

    // Scroll to section helpers
    function scrollToEewSection() {
      document.getElementById('eewSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToTsunamiSection() {
      document.getElementById('tsunamiSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToWeatherSection() {
      document.getElementById('weatherSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    let lastScrollY = 0;
    let ticking = false;
    const navBar = document.querySelector('.nav-bar');

    function updateNavBar() {
      const currentScrollY = window.scrollY;
      if (currentScrollY > 50) {
        navBar.classList.add('scrolled');
      } else {
        navBar.classList.remove('scrolled');
      }
      lastScrollY = currentScrollY;
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(updateNavBar);
        ticking = true;
      }
    }, { passive: true });

    // Pull to Refresh Implementation
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const pullRefreshEl = document.getElementById('pullRefresh');
    const pullRefreshSpan = pullRefreshEl.querySelector('span');

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const diff = currentY - startY;

      if (diff > 0) {
        const pullDistance = Math.min(diff * 0.4, 80);
        pullRefreshEl.style.display = 'flex';
        pullRefreshEl.style.transform = `translateX(-50%) translateY(${pullDistance}px)`;
        if (pullDistance > 50) {
          pullRefreshSpan.textContent = '指を離して更新...';
        } else {
          pullRefreshSpan.textContent = '引っ張って更新...';
        }
      }
    }, { passive: true });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;
      const diff = currentY - startY;

      if (diff > 120) {
        pullRefreshEl.classList.add('active');
        pullRefreshEl.style.transform = 'translateX(-50%) translateY(50px)';
        pullRefreshSpan.textContent = 'データを更新中...';

        try {
          await fetchAllData();
        } catch (err) {
          console.error(err);
        }
        pullRefreshEl.classList.remove('active');
      }

      pullRefreshEl.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
      pullRefreshEl.style.transform = 'translateX(-50%) translateY(-20px)';
      pullRefreshEl.style.opacity = '0';

      setTimeout(() => {
        pullRefreshEl.style.display = 'none';
        pullRefreshEl.style.transition = '';
        pullRefreshEl.style.opacity = '1';
      }, 300);

      startY = 0;
      currentY = 0;
    });

    document.getElementById('reloadButton').addEventListener('click', () => fetchAllData().catch(console.error));

    document.addEventListener('DOMContentLoaded', () => {
      fetchAllData();

      document.addEventListener('click', (e) => {
        const button = e.target.closest('[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        const index = button.dataset.index;

        if (action === 'copy-earthquake') {
          e.stopPropagation();
          copyEarthquakeInfo(parseInt(index), button);
        } else if (action === 'copy-eew') {
          e.stopPropagation();
          copyEewInfo(button);
        } else if (action === 'copy-tsunami') {
          e.stopPropagation();
          copyTsunamiInfo(parseInt(index), button);
        }
      });
    });
  </script>
</body>

</html>
